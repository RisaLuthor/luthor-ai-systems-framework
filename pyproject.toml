[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luthor-ai-systems-framework"
version = "0.1.0"
description = "Governance-first, deterministic AI frameworks for enterprise deployment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135.3",
  "uvicorn[standard]>=0.44.0",
  "pyyaml>=6.0.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.10",
  "httpx>=0.28.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
"laf" = ["policies/*.yaml"]
